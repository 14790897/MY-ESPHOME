
esphome:
  name: mpu6500-esp32c3
  platformio_options:
    monitor_speed: 115200

esp32:
  board: airm2m_core_esp32c3
  framework:
    type: arduino

# WiFi配置
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # 创建WiFi热点作为备用
  ap:
    ssid: "MPU6500-ESP32C3"
    password: "12345678"

# Home Assistant API
api:

# OTA更新
ota:
  platform: esphome

# 日志配置
logger:
  level: INFO

# Web服务器
web_server:
  port: 80


# I2C总线配置
i2c:
  sda: GPIO4 # 根据实际接线调整
  scl: GPIO5 # 根据实际接线调整
  scan: true
  frequency: 400kHz

# MPU6500传感器配置
sensor:
  # MPU6500加速度计和陀螺仪
  - platform: mpu6050
    address: 0x68 # MPU6500默认I2C地址，如果AD0接高电平则为0x69
    update_interval: 50ms  # 平台级别的更新间隔
    accel_x:
      name: "MPU6500 Acceleration X"
      id: mpu6500_accel_x
      unit_of_measurement: "m/s²"
      accuracy_decimals: 3
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    accel_y:
      name: "MPU6500 Acceleration Y"
      id: mpu6500_accel_y
      unit_of_measurement: "m/s²"
      accuracy_decimals: 3
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    accel_z:
      name: "MPU6500 Acceleration Z"
      id: mpu6500_accel_z
      unit_of_measurement: "m/s²"
      accuracy_decimals: 3
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    gyro_x:
      name: "MPU6500 Gyroscope X"
      id: mpu6500_gyro_x
      unit_of_measurement: "°/s"
      accuracy_decimals: 3
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    gyro_y:
      name: "MPU6500 Gyroscope Y"
      id: mpu6500_gyro_y
      unit_of_measurement: "°/s"
      accuracy_decimals: 3
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    gyro_z:
      name: "MPU6500 Gyroscope Z"
      id: mpu6500_gyro_z
      unit_of_measurement: "°/s"
      accuracy_decimals: 3
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    temperature:
      name: "MPU6500 Temperature"
      id: mpu6500_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1

  # 计算合成加速度
  - platform: template
    name: "MPU6500 Total Acceleration"
    id: mpu6500_total_accel
    unit_of_measurement: "m/s²"
    accuracy_decimals: 3
    lambda: |-
      float ax = id(mpu6500_accel_x).state;
      float ay = id(mpu6500_accel_y).state;
      float az = id(mpu6500_accel_z).state;
      return sqrt(ax*ax + ay*ay + az*az);
    update_interval: 100ms

  # 计算倾斜角度（互补滤波：融合加速度计和陀螺仪）
  - platform: template
    name: "MPU6500 Tilt Angle X"
    id: mpu6500_tilt_x
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 50ms  # 更快的更新频率以获得更好的融合效果
    lambda: |-
      // 检查传感器数据是否可用
      if (!id(mpu6500_accel_x).has_state() ||
          !id(mpu6500_accel_y).has_state() ||
          !id(mpu6500_accel_z).has_state() ||
          !id(mpu6500_gyro_y).has_state()) {
        return NAN;
      }

      static float angle = 0.0f;
      static bool initialized = false;

      // 读取传感器数据
      float ax = id(mpu6500_accel_x).state;
      float ay = id(mpu6500_accel_y).state;
      float az = id(mpu6500_accel_z).state;
      float gy = id(mpu6500_gyro_y).state;  // X轴倾角由Y轴陀螺仪角速度积分

      // 从加速度计计算角度
      float accel_angle = atan2(ay, sqrt(ax*ax + az*az)) * 180.0 / 3.14159;

      // 首次初始化，使用加速度计角度
      if (!initialized) {
        angle = accel_angle;
        initialized = true;
        ESP_LOGI("tilt", "Tilt X initialized: %.2f°", angle);
        return angle;
      }

      // 互补滤波参数
      const float dt = 0.05f;      // 时间间隔 50ms
      const float alpha = 0.98f;   // 陀螺仪权重 98%，加速度计权重 2%

      // 互补滤波：融合陀螺仪积分和加速度计测量
      // angle = α × (angle + gyro × dt) + (1-α) × accel_angle
      angle = alpha * (angle + gy * dt) + (1.0f - alpha) * accel_angle;

      return angle;

  - platform: template
    name: "MPU6500 Tilt Angle Y"
    id: mpu6500_tilt_y
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 50ms  # 更快的更新频率以获得更好的融合效果
    lambda: |-
      // 检查传感器数据是否可用
      if (!id(mpu6500_accel_x).has_state() ||
          !id(mpu6500_accel_y).has_state() ||
          !id(mpu6500_accel_z).has_state() ||
          !id(mpu6500_gyro_x).has_state()) {
        return NAN;
      }

      static float angle = 0.0f;
      static bool initialized = false;

      // 读取传感器数据
      float ax = id(mpu6500_accel_x).state;
      float ay = id(mpu6500_accel_y).state;
      float az = id(mpu6500_accel_z).state;
      float gx = id(mpu6500_gyro_x).state;  // Y轴倾角由X轴陀螺仪角速度积分

      // 从加速度计计算角度
      float accel_angle = atan2(-ax, sqrt(ay*ay + az*az)) * 180.0 / 3.14159;

      // 首次初始化，使用加速度计角度
      if (!initialized) {
        angle = accel_angle;
        initialized = true;
        ESP_LOGI("tilt", "Tilt Y initialized: %.2f°", angle);
        return angle;
      }

      // 互补滤波参数
      const float dt = 0.05f;      // 时间间隔 50ms
      const float alpha = 0.98f;   // 陀螺仪权重 98%，加速度计权重 2%

      // 互补滤波：融合陀螺仪积分和加速度计测量
      // angle = α × (angle + gyro × dt) + (1-α) × accel_angle
      angle = alpha * (angle - gx * dt) + (1.0f - alpha) * accel_angle;  // 注意这里是 -gx

      return angle;

    # Δa = |a| - g_base（单位换成 g，更直观）
  - platform: template
    name: "Δa"
    id: delta_a_ema
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 100ms
    lambda: |-
      if (!id(mpu6500_accel_x).has_state() ||
          !id(mpu6500_accel_y).has_state() ||
          !id(mpu6500_accel_z).has_state()) {
      ESP_LOGD("acc", "waiting states...");
      return NAN;
      }

      const float G = 9.81f;
      static float ema = 0.0f;
      static bool  inited = false;

      float ax = id(mpu6500_accel_x).state;
      float ay = id(mpu6500_accel_y).state;
      float az = id(mpu6500_accel_z).state;
      float amag = sqrtf(ax*ax + ay*ay + az*az);
      float da = fabsf(amag - id(g_base)) / G;

      if (!inited || isnan(ema) || isnan(da)) {
      if (!isnan(da)) { ema = da; inited = true; ESP_LOGI("acc","init ema with da=%.3f", da); }
      return ema;
      }

      const float alpha = 0.30f;
      ema = alpha * da + (1.0f - alpha) * ema;  //ESP_LOGI("acc", "da=%.3f, ema=%.3f", da, ema);

      return ema;

  # 陀螺仪模长 |ω|（°/s），同样做 EMA
  - platform: template
    name: "Δgyro"
    id: gyro_mag_ema
    unit_of_measurement: "°/s"
    accuracy_decimals: 1
    update_interval: 100ms # 建议加快到 100ms 更灵敏
    lambda: |-
      // 1) 先确认三轴都有值
      if (!id(mpu6500_gyro_x).has_state() ||
          !id(mpu6500_gyro_y).has_state() ||
          !id(mpu6500_gyro_z).has_state()) {
      ESP_LOGD("gyro", "waiting states...");
      return NAN;
      }

      static float ema = 0.0f;
      static bool  inited = false;

      float gx = id(mpu6500_gyro_x).state;
      float gy = id(mpu6500_gyro_y).state;
      float gz = id(mpu6500_gyro_z).state;

      // 2) 计算原始模长
      float w = sqrtf(gx*gx + gy*gy + gz*gz);

      // 3) 如果之前 ema 曾经是 NaN，或首次有数据，用当前 w 来初始化
      if (!inited || isnan(ema) || isnan(w)) {
      if (!isnan(w)) {
          ema = w;
          inited = true;
          ESP_LOGI("gyro", "init ema with raw=%.2f", w);
      }
      return ema;  // 可能是 NAN（w 也是 NaN 时），下帧再算
      }

      // 4) 正常 EMA 更新
      const float alpha = 0.30f;
      ema = alpha * w + (1.0f - alpha) * ema; //ESP_LOGI("gyro", "raw=%.2f, ema=%.2f", w, ema);
      return ema;

  # 系统运行时间
  - platform: uptime
    name: "Uptime"
    update_interval: 6000s

globals:
  - id: g_base
    type: float
    restore_value: yes
    initial_value: "9.81" # 初始按 1g，标定后会覆盖

  - id: g_calibrated
    type: bool
    restore_value: yes
    initial_value: "false" # 标记是否已标定

button:
  - platform: template
    name: "标定1g基线(静置按)"
    icon: mdi:axis-arrow
    on_press:
      - lambda: |-
          // 请在设备完全静止且放置稳定时按下
          const int N = 100;
          float sx = 0, sy = 0, sz = 0;
          for (int i = 0; i < N; i++) {
            sx += id(mpu6500_accel_x).state;
            sy += id(mpu6500_accel_y).state;
            sz += id(mpu6500_accel_z).state;
            delay(10); // 约1秒
          }
          float ax = sx / N, ay = sy / N, az = sz / N;
          float g = sqrtf(ax*ax + ay*ay + az*az);
          id(g_base) = g;   // 保存为新的 1g 基线
          id(g_calibrated) = true;  // 标记已完成标定
          ESP_LOGI("calib", "g_base calibrated = %.4f m/s^2", id(g_base));
          ESP_LOGI("calib", "Calibration completed successfully!");

text_sensor:
  - platform: template
    name: "校准状态"
    id: calibration_status
    icon: mdi:check-circle
    update_interval: 10s
    lambda: |-
      if (id(g_calibrated)) {
        return {"已校准 ✓"};
      } else {
        return {"⚠️ 未校准 - 请先标定1g基线"};
      }

interval:
  - interval: 30s
    then:
      - lambda: |-
          // 启动后定期提醒用户标定
          if (!id(g_calibrated)) {
            ESP_LOGW("calib", "========================================");
            ESP_LOGW("calib", "警告: 设备未标定!");
            ESP_LOGW("calib", "请将设备静止放置后按下 '标定1g基线' 按钮");
            ESP_LOGW("calib", "========================================");
          }


binary_sensor:
  - platform: template
    name: "Motion Detection (Fused)"
    id: motion_fused
    lambda: |-
      // 滞回阈值（可按环境微调）
      const float TH_ON_DA  = 0.10f;  // Δa 触发阈值（g）
      const float TH_OFF_DA = 0.05f;  // Δa 释放阈值（g）
      const float TH_ON_W   = 30.0f;  // |ω| 触发阈值（°/s）
      const float TH_OFF_W  = 12.0f;  // |ω| 释放阈值（°/s）

      static bool state = false;
      float da = id(delta_a_ema).state;
      float w  = id(gyro_mag_ema).state;

      if (!state) {
        if (da > TH_ON_DA || w > TH_ON_W) state = true;   // 触发：任一满足
      } else {
        if (da < TH_OFF_DA && w < TH_OFF_W) state = false; // 释放：同时低于
      }
      return state;
    filters:
      - delayed_on: 100ms # 去抖（触发保持）
      - delayed_off: 500ms # 释放保持，防抖更久

