esphome:
  name: light-sensor
  platformio_options:
    monitor_speed: 115200

esp32:
  board: airm2m_core_esp32c3
  framework:
    type: arduino

# WiFi配置
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # 创建WiFi热点作为备用
  ap:
    ssid: "Light-Sensor"
    password: "12345678"

# Home Assistant API
api:

# OTA更新
ota:
  platform: esphome

# 日志配置
logger:
  level: INFO

# Web服务器
web_server:
  port: 80
  auth:
    username: admin
    password: !secret wifi_password

# 光敏电阻传感器配置
sensor:
  # ADC 读取电压 (0-3.3V)
  - platform: adc
    pin: GPIO3  # 根据实际接线调整 
    name: "Light Sensor Voltage"
    id: light_sensor_voltage
    update_interval: 1s
    attenuation: 11db  # 支持0-3.3V输入，自动转换为电压
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # 转换为光照百分比 (0-100%)
  - platform: template
    name: "Light Sensor Percentage"
    id: light_sensor_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:brightness-6"
    lambda: |-
      float voltage = id(light_sensor_voltage).state;
      
      // 光敏电阻特性: 光越强，电压越低
      // 暗光: ~3.3V -> 0%
      // 开灯: ~1.7V -> 48%
      // 强光: ~0.5V -> 85%
      float pct = (1.0 - voltage / 3.3) * 100.0;
      
      // 输出调试信息
      ESP_LOGI("light", "Voltage: %.2fV, Percentage: %.1f%%", voltage, pct);
      return pct;
    update_interval: 1s

  # 估算光照强度 (Lux)
  # 注意: 这是粗略估算，需要根据实际光敏电阻校准
  - platform: template
    name: "Light Sensor Lux"
    id: light_sensor_lux
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    device_class: illuminance
    state_class: measurement
    icon: "mdi:brightness-5"
    lambda: |-
      float voltage = id(light_sensor_voltage).state;
      
      // 光敏电阻特性: 光越强，电压越低，需要反转
      float inverted_voltage = 3.3 - voltage;
      
      // 粗略的指数映射 (需要根据实际环境校准)
      // 暗光: 0-10 lx
      // 室内: 100-500 lx  
      // 明亮: 1000-10000 lx
      if (inverted_voltage < 0.1) return 0;
      float lux = pow(10, (inverted_voltage / 3.3) * 4);  // 0.1-10000范围
      return lux;
    update_interval: 1s

  # 系统运行时间
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# 光照等级分类
text_sensor:
  - platform: template
    name: "Light Level"
    id: light_level
    icon: "mdi:theme-light-dark"
    lambda: |-
      float pct = id(light_sensor_percentage).state;
      if (pct < 10) return {"Very Dark"};      // <10%: 完全黑暗
      else if (pct < 30) return {"Dark"};       // 10-30%: 暗光
      else if (pct < 50) return {"Dim"};        // 30-50%: 昏暗 (开灯约48%)
      else if (pct < 70) return {"Moderate"};   // 50-70%: 中等
      else if (pct < 85) return {"Bright"};     // 70-85%: 明亮
      else return {"Very Bright"};              // >85%: 强光
    update_interval: 1s



# HTTP RESTful API 端点
# 其他设备可通过 HTTP GET 请求获取数据
# 示例:
#   curl http://light-sensor.local/sensor/light_sensor_percentage
#   curl http://light-sensor.local/sensor/light_sensor_lux
#   curl http://light-sensor.local/text_sensor/light_level
