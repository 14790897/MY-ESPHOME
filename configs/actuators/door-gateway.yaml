# ===================================================================
# 门锁网关 - ESP-NOW 发射端 (有线供电, 连接 HA)
# ===================================================================
# 架构: ESP32 + WiFi + ESP-NOW
# 角色: 接收 HA 指令 → 通过 ESP-NOW 转发给门锁 ESP32-C3
# 放置位置: 门旁边, 有线供电 (USB或5V电源)
# ===================================================================

esphome:
  name: door-gateway
  friendly_name: "门锁网关"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_direction(GPIO_NUM_13, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 0);
          gpio_set_level(GPIO_NUM_13, 0);

esp32:
  board: airm2m_core_esp32c3
  framework:
    type: esp-idf  # ESP-NOW 需要 ESP-IDF 框架
    # version: 5.5.0

# WiFi 连接 (ESP-NOW 会自动使用相同信道)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

web_server:
  port: 80

# 时间调度 (自动切换夜间/白天模式)
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - logger.log: "22:00 进入夜间模式"
          - script.execute: send_night_cmd
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - logger.log: "07:00 进入白天模式"
          - script.execute: send_day_cmd

# ===================================================================
# ESP-NOW 配置
# ===================================================================
# ⚠️ peers 填写门锁 ESP32-C3 的 MAC 地址
# 获取方法: esptool read_mac 或首次USB烧录时串口输出
espnow:
  peers:
    - "b0:a6:04:57:63:b0"  # 门锁 ESP32-C3
  # channel 不设置 - 自动跟随 WiFi AP 信道

# ===================================================================
# 发送脚本 - 重复发送覆盖门锁整个唤醒周期
# ===================================================================
# 门锁周期: 白天 1s(醒30ms), 夜间 20s(醒30ms)
# 25ms间隔 < 30ms窗口, 保证每次醒来必定命中
script:
  # 开门: 45×25ms = 1125ms > 1s 白天周期
  - id: send_open_cmd
    mode: restart
    then:
      - repeat:
          count: 45
          then:
            - espnow.send:
                address: "b0:a6:04:57:63:b0"
                data: [0x01]
            - delay: 25ms

  # 关门: 同上
  - id: send_close_cmd
    mode: restart
    then:
      - repeat:
          count: 45
          then:
            - espnow.send:
                address: "b0:a6:04:57:63:b0"
                data: [0x02]
            - delay: 25ms

  # 夜间模式: 22:00 发送, 此时门锁还在 1s 白天周期
  - id: send_night_cmd
    mode: restart
    then:
      - repeat:
          count: 45
          then:
            - espnow.send:
                address: "b0:a6:04:57:63:b0"
                data: [0x03]
            - delay: 25ms

  # 白天模式: 07:00 发送, 门锁在 20s 夜间周期
  # 840×25ms = 21s > 20s 周期
  - id: send_day_cmd
    mode: restart
    then:
      - repeat:
          count: 840
          then:
            - espnow.send:
                address: "b0:a6:04:57:63:b0"
                data: [0x04]
            - delay: 25ms


# ===================================================================
# HA 控制按钮
# ===================================================================
button:
  - platform: template
    name: "Door Open"
    id: door_open_btn
    icon: "mdi:door-open"
    on_press:
      then:
        - logger.log: "触发开门 → ESP-NOW 重复发送中..."
        - script.execute: send_open_cmd

  - platform: template
    name: "Door Close"
    id: door_close_btn
    icon: "mdi:door-closed-lock"
    on_press:
      then:
        - logger.log: "触发关门 → ESP-NOW 重复发送中..."
        - script.execute: send_close_cmd

  - platform: template
    name: "Night Mode"
    id: door_night_btn
    icon: "mdi:weather-night"
    on_press:
      then:
        - logger.log: "手动触发夜间模式 → ESP-NOW 发送中..."
        - script.execute: send_night_cmd

  - platform: template
    name: "Day Mode"
    id: door_day_btn
    icon: "mdi:weather-sunny"
    on_press:
      then:
        - logger.log: "手动触发白天模式 → ESP-NOW 发送中..."
        - script.execute: send_day_cmd

  - platform: restart
    name: "Gateway Restart"

# ===================================================================
# 状态监控
# ===================================================================
binary_sensor:
  - platform: status
    name: "Gateway Status"

sensor:
  - platform: wifi_signal
    name: "Gateway WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Gateway Uptime"
    update_interval: 60s
