packages:
  base: !include ../../common.yaml

esphome:
  name: door-opener-esp32c3
  friendly_name: "门锁控制器"
  on_boot:
    priority: -100 # 最后执行，确保网络等已就绪
    then:
      - servo.detach: door_servo # 开机时不驱动舵机，保持自由状态

esp32:
  board: airm2m_core_esp32c3
  framework:
    type: arduino # 改为arduino框架，更稳定  蓝牙需要 esp-idf节省存储空间

wifi:
  power_save_mode: LIGHT # WiFi省电模式，降低约20-30mA

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - logger.log: "Entering night deep sleep"
          - deep_sleep.enter:
              id: deep_sleep_control
              sleep_duration: 10h

deep_sleep:
  id: deep_sleep_control

logger:
  baud_rate: 0 # 关闭串口输出，省电 ~2-3mA（无线日志不受影响）
  level: WARN
  logs:
    wifi: WARN
    api: WARN
    deep_sleep: WARN

# PWM output configuration
output:
  - platform: ledc
    id: door_servo_pwm
    pin: GPIO9
    frequency: 100Hz

# Door servo control configuration
servo:
  - id: door_servo
    output: door_servo_pwm
    auto_detach_time: 2s # Auto disconnect after 2s to ensure door operation completion
    min_level: 0%
    max_level: 25%

# Door control
number:
  - platform: template
    name: "door_angle"
    id: door_angle
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 180 # Default closed position (180 degrees)
    optimistic: true
    set_action:
      then:
        - servo.write:
            id: door_servo
            level: !lambda "return x / 180.0;"

# Door preset operations
button:
  - platform: template
    name: "door_open"
    id: door_open_btn
    icon: "mdi:door-open"
    on_press:
      then:
        - logger.log: "Executing door open operation - Set to 0 degrees"
        - servo.write:
            id: door_servo
            level: 0.0 # 0 degrees, fully open
        - number.set:
            id: door_angle
            value: 0

  - platform: template
    name: "door_close"
    id: door_close_btn
    icon: "mdi:door-closed-lock"
    on_press:
      then:
        - logger.log: "Executing door close operation - Set to 180 degrees"
        - servo.write:
            id: door_servo
            level: 1.0 # 180 degrees, closed position
        - number.set:
            id: door_angle
            value: 180

