packages:
  base: !include ../../common.yaml

esphome:
  name: max98357a-mediaplayer-esp32s3
  platformio_options:
    monitor_speed: 115200

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
  flash_size: 8MB

# OTA更新
ota:
  platform: esphome

# 日志配置
logger:
  level: INFO

# I2S音频总线配置
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO6   # LRC/WS (Word Select) 引脚
    i2s_bclk_pin: GPIO7    # BCLK (Bit Clock) 引脚

# 媒体播放器（可通过 Home Assistant 控制）
media_player:
  - platform: i2s_audio
    id: max98357a_player
    name: "MAX98357A Media Player"
    dac_type: external
    i2s_dout_pin: GPIO10   # DIN (Data In) 引脚 
    i2s_audio_id: i2s_out

# 系统传感器
sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

  - platform: template
    name: "Player Status"
    lambda: |-
      if (id(max98357a_player)->state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
        return {"Playing"};
      } else if (id(max98357a_player)->state == media_player::MEDIA_PLAYER_STATE_PAUSED) {
        return {"Paused"};
      } else if (id(max98357a_player)->state == media_player::MEDIA_PLAYER_STATE_IDLE) {
        return {"Idle"};
      } else {
        return {"Unknown"};
      }
    update_interval: 1s
