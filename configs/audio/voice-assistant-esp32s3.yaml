packages:
  base: !include ../../common.yaml

esphome:
  name: voice-assistant-esp32s3
  platformio_options:
    build_flags:
        - "-DBOARD_HAS_PSRAM"
        - "-DIDF_TARGET_ESP32S3"
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
    build_unflags:
      - "-Werror=all"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
  flash_size: 16MB
psram:
  mode: octal
  speed: 80MHz

# OTA Update
ota:
  platform: esphome

# Logger Configuration
logger:
  level: INFO

# I2S Audio Bus - Input (Microphone)
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO6   # WS (Word Select/LRC) pin
    i2s_bclk_pin: GPIO7    # SCK (Bit Clock) pin

  - id: i2s_out
    i2s_lrclk_pin: GPIO16  # WS (Word Select/LRC) pin for speaker
    i2s_bclk_pin: GPIO17   # SCK (Bit Clock) pin for speaker

# INMP441 Microphone Configuration
microphone:
  - platform: i2s_audio
    id: inmp441_mic
    adc_type: external      # External ADC
    i2s_din_pin: GPIO8      # SD (Serial Data) pin
    i2s_audio_id: i2s_in
    pdm: false              # INMP441 uses standard I2S, not PDM
    channel: left           # Channel selection (INMP441 L/R pin to GND=left, to VCC=right)
    bits_per_sample: 32bit  # Bit depth
    sample_rate: 16000      # Sample rate (Hz) - suitable for speech recognition

# MAX98357A Speaker Configuration
speaker:
  - platform: i2s_audio
    id: max98357a_speaker
    dac_type: external
    i2s_dout_pin: GPIO18    # DIN (Data In) pin
    i2s_audio_id: i2s_out
    sample_rate: 16000      # Sample rate (Hz)
    bits_per_sample: 16bit  # Bit depth
    channel: right          # Use right channel (MAX98357A usually listens to right channel)

# Voice Assistant Configuration
voice_assistant:
  id: va
  microphone: inmp441_mic
  speaker: max98357a_speaker
  use_wake_word: false              # Wake word disabled (manual trigger only)
  noise_suppression_level: 2        # Noise suppression level (0-4)
  auto_gain: 31dBFS                 # Automatic gain control
  volume_multiplier: 2.0            # Volume multiplier

  on_listening:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        effect: "fast_pulse"

  on_stt_vad_start:
    - script.stop: listening_timeout  # 检测到语音，取消超时
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        effect: none

  on_stt_vad_end:
    - light.turn_off: status_led

  on_tts_start:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 0%
        blue: 100%
        effect: none

  on_tts_end:
    - script.execute: listening_timeout  # 重新启动超时计时器
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        effect: "fast_pulse"  # 显示继续监听状态

  on_end:
    - script.stop: listening_timeout  # 正常结束，取消超时
    - light.turn_off: status_led

  on_error:
    - script.stop: listening_timeout  # 错误发生，取消超时
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        effect: none
    - delay: 1s
    - light.turn_off: status_led

# Status LED - WS2812 on GPIO48
light:
  - platform: neopixelbus
    id: status_led
    name: "Status LED"
    type: GRB           # WS2812 uses GRB color order
    variant: WS2812
    pin: GPIO48
    num_leds: 1         # Single LED (adjust if using LED strip)
    effects:
      - pulse:
          name: "fast_pulse"
          transition_length: 0.5s
          update_interval: 0.5s
      - pulse:
          name: "slow_pulse"
          transition_length: 1s
          update_interval: 1s

# Manual Control Buttons
button:
  - platform: template
    id: start_listening_button
    name: "Start Listening"
    icon: mdi:microphone
    on_press:
      - voice_assistant.start_continuous:
      - script.execute: listening_timeout

  - platform: template
    id: stop_listening_button
    name: "Stop Listening"
    icon: mdi:microphone-off
    on_press:
      - voice_assistant.stop:
      - script.stop: listening_timeout

# Auto-stop script (60s timeout for continuous conversation)
script:
  - id: listening_timeout
    mode: restart
    then:
      - delay: 60s
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
            - light.turn_off: status_led

# System Sensors
sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# Binary Sensor (Optional - Connect physical button for Toggle Talk)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Toggle Talk"
    on_click:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
            - script.stop: listening_timeout
          else:
            - voice_assistant.start_continuous:
            - script.execute: listening_timeout
